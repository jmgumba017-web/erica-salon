<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Erica Salon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="text-scale.css">
</head>
<body class="login-page">

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="top-logo">
                <img src="image/logo.jpg" alt="Erica Salon Logo">
                <div class="logo-text">
                    <div class="logo-name">Erica Salon</div>
                    <span class="logo-subtitle">Your journey to Elegance and Beauty starts with us</span>
                </div>
            </a>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-container">

            <div class="script-title">Reset Password</div>
            <h2>Set New Password</h2>
            <p class="login-subtitle">I-enter ang bagong password mo ✨</p>

            <form id="resetPasswordForm" class="login-form">
                <div class="input-group">
                    <label for="newPassword"><i class="fa-solid fa-lock"></i> New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password (min 6)" required minlength="6">
                </div>

                <div class="input-group">
                    <label for="confirmPassword"><i class="fa-solid fa-lock"></i> Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6">
                </div>

                <button type="submit" class="button login-btn" id="submitBtn">
                    <i class="fa-solid fa-key"></i> Reset Password
                </button>
            </form>

            <p class="signup-link">
                <a href="login.html">
                    <i class="fa-solid fa-arrow-left"></i> Back to Login
                </a>
            </p>
        </div>
    </main>

    <footer>
        <div class="footer-logo">Erica Salon</div>
        <p>© 2026 Gorgeous Erica Nails &amp; Salon. All rights reserved.</p>
    </footer>

    <script src="ui.js"></script>
    <script>
       const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? window.location.origin
  : 'https://erica-salon.onrender.com';   // ✅ TAMA
        const form = document.getElementById('resetPasswordForm');
        const submitBtn = document.getElementById('submitBtn');

        // Kunin ang token at email sa URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const email = params.get('email');

        // ✅ Validate na may token at email
        if (!token || !email) {
            document.querySelector('.login-container').innerHTML = `
                <div style="text-align:center; padding: 20px;">
                    <i class="fa-solid fa-circle-exclamation" style="font-size: 60px; color: #dc3545; margin-bottom: 20px;"></i>
                    <h2 style="color: #a70d40;">Invalid Reset Link</h2>
                    <p style="color: #666; margin: 20px 0;">Ang link na ito ay invalid o expired.</p>
                    <a href="forgot-password.html" class="button login-btn" style="text-decoration: none; display: inline-block;">
                        <i class="fa-solid fa-redo"></i> Request New Link
                    </a>
                </div>
            `;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                return Toast.error('Passwords do not match');
            }

            if (newPassword.length < 6) {
                return Toast.error('Password must be at least 6 characters');
            }

            submitBtn.disabled = true;
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';

            try {
                const res = await fetch(`${API_URL}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, token, newPassword, confirmPassword })
                });

                const data = await res.json();
                console.log('📥 Response:', data);

                if (data.success) {
                    Toast.success('Password reset successful!');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    Toast.error(data.message);
                }
            } catch (err) {
                console.error('❌ Error:', err);
                Toast.error('Network error. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
